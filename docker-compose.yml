name: ai-creative-workshop

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SQLITE_PATH: /app/data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: "*"
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
